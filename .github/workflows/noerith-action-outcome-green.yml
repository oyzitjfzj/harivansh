name: NOERITH action outcome truth GREEN

on:
  push:
    branches:
      - "build/noerith-grader-qualification-verify-20260923"

permissions:
  contents: read

concurrency:
  group: noerith-action-outcome-green-20260923
  cancel-in-progress: false

jobs:
  relay-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout relay only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate focused relay privacy contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-noerith-action-outcome-green-relay-contract.sh

  green:
    needs: relay-self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: cd54974b09b4cbe2f4f832512e6497c976c2c0de
    steps:
      - name: Checkout relay only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Exact private NOERITH checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh

      - name: Focused GREEN verification
        shell: bash
        run: bash scripts/run-noerith-action-outcome-green.sh
