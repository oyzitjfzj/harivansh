name: NOERITH exact private-head verification

on:
  push:
    branches:
      - "build/noerith-private-verify-20260923"

permissions:
  contents: read

concurrency:
  group: noerith-private-verify-20260923
  cancel-in-progress: false

jobs:
  relay-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate relay privacy contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-noerith-relay-contract.sh

  verify:
    needs: relay-self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: 4c8391e26765d77751b620c7750b42290e484ba3
      QUAL_IMAGE: rust@sha256:ff521445a372125ed4f76e1453a1f8098f2d05332d1601d30db1c1f62757e730
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Exact private NOERITH checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh

      - name: Source-free private crate preflight classification
        shell: bash
        run: |
          set +e
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update >/dev/null 2>&1
          export RUSTUP_TOOLCHAIN=1.98.1
          cd "$ROOT"
          cargo fmt --manifest-path crates/noerith-capabilities/Cargo.toml -- --check >/dev/null 2>&1
          fmt_status=$?
          if [[ "$fmt_status" -ne 0 ]]; then
            while IFS= read -r -d '' path; do
              if ! rustfmt --edition 2024 --check "$path" >/dev/null 2>&1; then
                path_hash="$(printf '%s' "$path" | sha256sum | cut -d' ' -f1)"
                echo "NOERITH_FMT_PATH_SHA256=$path_hash"
                formatted="$(mktemp --suffix=.rs)"
                cp "$path" "$formatted"
                rustfmt --edition 2024 "$formatted" >/dev/null 2>&1 || true
                python - "$path" "$formatted" <<'PY'
          import difflib, sys
          original = open(sys.argv[1], encoding="utf-8").read().splitlines()
          formatted = open(sys.argv[2], encoding="utf-8").read().splitlines()
          for tag, i1, i2, j1, j2 in difflib.SequenceMatcher(a=original, b=formatted).get_opcodes():
              if tag == "equal":
                  continue
              print(
                  "NOERITH_FMT_EDIT="
                  f"{tag}:old={i1 + 1}-{i2}:new={j1 + 1}-{j2}:"
                  f"old_count={i2 - i1}:new_count={j2 - j1}"
              )
          PY
                rm -f "$formatted"
              fi
            done < <(find crates/noerith-capabilities -type f -name '*.rs' -print0 | sort -z)
          fi
          check_json="${RUNNER_TEMP}/noerith-check.jsonl"
          cargo check --manifest-path crates/noerith-capabilities/Cargo.toml --locked --all-targets --message-format=json >"$check_json" 2>&1
          check_status=$?
          python - "$check_json" <<'PY'
          import json, re, sys
          codes = {}
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          for line in raw.splitlines():
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if event.get("reason") != "compiler-message":
                  continue
              message = event.get("message") or {}
              if message.get("level") != "error":
                  continue
              code = (message.get("code") or {}).get("code") or "NO_CODE"
              codes[code] = codes.get(code, 0) + 1
          for code in re.findall(r"error\\[(E\\d{4})\\]", raw):
              codes[code] = max(1, codes.get(code, 0))
          for code, count in sorted(codes.items()):
              print(f"NOERITH_RUST_ERROR_CODE={code} count={count}")
          lower = raw.lower()
          if not codes:
              for label, marker in (
                  ("LOCKED", "lock file"),
                  ("MANIFEST", "failed to parse manifest"),
                  ("WORKSPACE", "current package believes it's in a workspace"),
                  ("NETWORK", "failed to download"),
              ):
                  if marker in lower:
                      print(f"NOERITH_CHECK_FAILURE_CLASS={label}")
          PY
          rm -f "$check_json"
          isolated_log="${RUNNER_TEMP}/noerith-isolated-classifier.log"
          clean_cwd="$(mktemp -d)"
          (
            cd "$clean_cwd"
            RUSTUP_TOOLCHAIN=1.98.1 python -I "$ROOT/tools/verify_isolated_pinned_crate.py" crates/noerith-capabilities
          ) >"$isolated_log" 2>&1
          isolated_status=$?
          python - "$isolated_log" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          for code in sorted(set(re.findall(r"error\[(E\d{4})\]", text))):
              print(f"NOERITH_ISOLATED_RUST_ERROR_CODE={code}")
          for code, path, line, col in re.findall(
              r"error\[(E\d{4})\]:[^\n]*\n\s*-->\s+([^:\n]+):(\d+):(\d+)",
              text,
          ):
              import hashlib
              path_hash = hashlib.sha256(path.encode()).hexdigest()
              print(
                  "NOERITH_ISOLATED_RUST_ERROR_SITE="
                  f"{code}:path_sha256={path_hash}:line={line}:col={col}"
              )
          for lint in sorted(set(re.findall(r"(?:clippy::)?([a-z][a-z0-9_]+)\s+implied by\s+-D\s+warnings", text))):
              print(f"NOERITH_ISOLATED_DENIED_LINT={lint}")
          for lint in sorted(set(re.findall(r"\[(clippy::[a-z0-9_]+)\]", text))):
              print(f"NOERITH_ISOLATED_CLIPPY_LINT={lint}")
          PY
          for stage in selftest rustc generate-lockfile fetch metadata fmt check clippy test; do
            case "$stage" in
              selftest) pattern='isolated verifier contract self-tests passed' ;;
              rustc) pattern='+ rustc --version' ;;
              *) pattern="+ cargo $stage " ;;
            esac
            if grep -Fq "$pattern" "$isolated_log"; then
              safe_stage="${stage//-/_}"
              echo "NOERITH_ISOLATED_REACHED_${safe_stage}=1"
            else
              safe_stage="${stage//-/_}"
              echo "NOERITH_ISOLATED_REACHED_${safe_stage}=0"
            fi
          done
          echo "NOERITH_ISOLATED_STATUS=$isolated_status"
          rm -f "$isolated_log"
          rm -rf "$clean_cwd"

          if [[ "$fmt_status" -ne 0 ]]; then
            semantic_root="$(mktemp -d)/repo"
            cp -a "$ROOT" "$semantic_root"
            while IFS= read -r -d '' path; do
              rustfmt --edition 2024 "$path" >/dev/null 2>&1
            done < <(find "$semantic_root/crates/noerith-capabilities" -type f -name '*.rs' -print0 | sort -z)
            semantic_log="${RUNNER_TEMP}/noerith-semantic-red-classifier.log"
            semantic_cwd="$(mktemp -d)"
            (
              cd "$semantic_cwd"
              RUSTUP_TOOLCHAIN=1.98.1 python -I "$semantic_root/tools/verify_isolated_pinned_crate.py" crates/noerith-capabilities
            ) >"$semantic_log" 2>&1
            semantic_status=$?
            python - "$semantic_log" <<'PY'
          import hashlib, re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          codes = sorted(set(re.findall(r"error\[(E\d{4})\]", text)))
          for code in codes:
              print(f"NOERITH_SEMANTIC_RUST_ERROR_CODE={code}")
          failed_tests = sorted(set(re.findall(r"^test ([^ ]+) \.\.\. FAILED$", text, re.MULTILINE)))
          print(f"NOERITH_SEMANTIC_FAILED_TEST_COUNT={len(failed_tests)}")
          for name in failed_tests:
              print("NOERITH_SEMANTIC_FAILED_TEST_SHA256=" + hashlib.sha256(name.encode()).hexdigest())
          for stage in ("selftest", "rustc", "generate-lockfile", "fetch", "metadata", "fmt", "check", "clippy", "test"):
              if stage == "selftest":
                  pattern = "isolated verifier contract self-tests passed"
              elif stage == "rustc":
                  pattern = "+ rustc --version"
              else:
                  pattern = f"+ cargo {stage} "
              print(f"NOERITH_SEMANTIC_REACHED_{stage.replace('-', '_')}={1 if pattern in text else 0}")
          PY
            echo "NOERITH_SEMANTIC_STATUS=$semantic_status"
            rm -rf "$(dirname "$semantic_root")" "$semantic_cwd" "$semantic_log"
          fi

          echo "NOERITH_PREFLIGHT_FMT_STATUS=$fmt_status"
          echo "NOERITH_PREFLIGHT_CHECK_STATUS=$check_status"
          exit 0

      - name: Encrypted exact rustfmt handoff
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          TMP="$(mktemp -d)"
          cp -a "$ROOT" "$TMP/repo"
          cd "$TMP/repo"
          for source_path in \
            crates/noerith-capabilities/src/lib.rs \
            crates/noerith-capabilities/src/quality_analysis_qualification.rs \
            crates/noerith-capabilities/tests/quality_analysis_qualification.rs \
            crates/noerith-capabilities/src/quality_analysis.rs \
            crates/noerith-capabilities/tests/quality_analysis.rs
          do
            rustfmt --edition 2024 "$source_path"
          done
          tar -czf "$TMP/formatted.tar.gz" \
            crates/noerith-capabilities/src/lib.rs \
            crates/noerith-capabilities/src/quality_analysis_qualification.rs \
            crates/noerith-capabilities/tests/quality_analysis_qualification.rs \
            crates/noerith-capabilities/src/quality_analysis.rs \
            crates/noerith-capabilities/tests/quality_analysis.rs
          cat >"$TMP/format-recipient.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIERzCCAq+gAwIBAgIUIDcnVK1KUlz6+3QnBld09Anm9g4wDQYJKoZIhvcNAQEL
          BQAwMzExMC8GA1UEAwwobm9lcml0aC1lcGhlbWVyYWwtZm9ybWF0LWhhbmRvZmYt
          Y3VycmVudDAeFw0yNjA5MjQxNDQxMDNaFw0yNjA5MjYxNDQxMDNaMDMxMTAvBgNV
          BAMMKG5vZXJpdGgtZXBoZW1lcmFsLWZvcm1hdC1oYW5kb2ZmLWN1cnJlbnQwggGi
          MA0GCSqGSIb3DQEBAQUAA4IBjwAwggGKAoIBgQC3bc7pZJQ7lZHPNM9SDrzm+ehv
          m8n7ZvANLY+XZXlnUkLKfK9SdVTq+lGXA//cZBPR590mzDranc8YKq/MvGlZnkuJ
          Kfro4EEMS+MTp2SnlJeKxfQwC/FpKK1K0Ao6Dy2QOg901gV5LCF9VzspxeBetRHT
          O/ZeWfnhMTHoL1kRXe+Bioe7g7ZDSZkiqgRK0ftvPKxwgSN4wAwYRZpEG/ot8kqX
          uamLlpHhiRXonFfBXGXJJSTfzpk9edJMKynr6d4slWP/dUSjkLDl5hgfqaXGDfP5
          y0dbwAyCKQoeRA8thdYKoOb9d7cn/0CWYXrI+YT8AyTBon09nuBMfY8TJTGWBcx0
          c9BJHmtgsJOOz0vMn/VKeaFERR5SV9MCSKhMvloYEFIxQayRtwoP16Yr6kkPTqxC
          m0E8q8krctbLYJJqf79bfeXkUBZMw1DoNblnURkwFAkNQAWkctztRrT9PwHTnG6w
          9JKFIK2eCN7jZVP7SoaDTSDdU6V2DFHgVoLvF+MCAwEAAaNTMFEwHQYDVR0OBBYE
          FEr50fClWddtj16OpkFCT6YTPDQvMB8GA1UdIwQYMBaAFEr50fClWddtj16OpkFC
          T6YTPDQvMA8GA1UdEwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADggGBAHLHBHYI
          rJdRX2BKN4GB1bmZOhw+LoIVxFpbBcw3ZfjKLFZ2W/fMp7lwUf+F41LS4Smo7r2W
          ZW8ij/qtktbKgLcxMD2hwkdNwzPqlflALiuM6pYmG4YKAh9FifufOlRHzYGt8JRK
          hhHsL1+3UPNKiDn0NOSfSGtVDr4G//uNWoPFvcGY9WRy99nrvZ0pa/ENnGKCqCXX
          ERWFXV7CcMZhr8FfpqLH5974rLmXIcK0WuuKVlhHiK7HPZUH8up7mHzNgHON0d10
          aGJSDOmjrfvAZx5+PAewPHNQ3dKwyd26VrVdlAXxatk+a8V6P/vCltj/RB61+qHn
          CJvpVRnCXmsQrLp72x7vIha1Ppb3Qs1dYd7Zgh5UgGYlbgSf0jYdr7F+cMtHwTsG
          JxW2CnvNxntKmkf8SWY8J5QCnhunBL7PAJmRll5lllBY6c/DwGwwxBDoqIlLmaYO
          cjpbipdc+UN8GNqiVlKcv2w42LTLj1L0FjogXUPoiALUWElMdwHwrFKmeA==
          -----END CERTIFICATE-----
          CERT
          openssl cms -encrypt -binary -aes256 -outform DER \
            -in "$TMP/formatted.tar.gz" \
            -out "$TMP/formatted.cms" \
            "$TMP/format-recipient.pem"
          echo "NOERITH_FORMAT_CIPHER_SHA256=$(sha256sum "$TMP/formatted.cms" | cut -d' ' -f1)"
          printf 'NOERITH_FORMAT_CIPHER_BASE64='
          base64 -w0 "$TMP/formatted.cms"
          echo
          cp "$TMP/formatted.cms" "${RUNNER_TEMP}/noerith-format-handoff.cms"
          rm -rf "$TMP"

      - name: Upload encrypted rustfmt handoff
        uses: actions/upload-artifact@v4
        with:
          name: noerith-format-handoff
          path: ${{ runner.temp }}/noerith-format-handoff.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Current-head verification
        shell: bash
        env:
          NOERITH_ENCRYPTED_DIAGNOSTIC_DIR: ${{ runner.temp }}/noerith-s05-bundle
        run: bash scripts/run-noerith-verification.sh

      - name: Real Docker qualification
        id: real_qualification
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -uo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          BUNDLE="${RUNNER_TEMP}/noerith-s05-bundle"
          PULL_LOG="${RUNNER_TEMP}/noerith-s05-pull.log"
          QUAL_LOG="${RUNNER_TEMP}/noerith-s05-qualification.log"
          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE"

          docker pull "$QUAL_IMAGE" >"$PULL_LOG" 2>&1
          pull_status=$?
          qual_status=99
          if [[ "$pull_status" -eq 0 ]]; then
            cd "$ROOT"
            python3 tools/verify_linux_oci_sandbox.py \
              --real-run \
              --image "$QUAL_IMAGE" \
              --output-dir "$BUNDLE/raw" \
              --expected-source-revision "$TARGET_SHA" \
              >"$QUAL_LOG" 2>&1
            qual_status=$?
          fi

          if [[ "$pull_status" -eq 0 && "$qual_status" -ne 0 ]]; then
            NOERITH_ROOT="$ROOT" NOERITH_IMAGE="$QUAL_IMAGE" NOERITH_DIAG="$BUNDLE/pid-pressure-diagnostic.json" python3 - <<'PY' >/dev/null 2>&1
          import importlib.util
          import json
          import os
          from pathlib import Path
          import tempfile
          
          root = Path(os.environ["NOERITH_ROOT"])
          spec = importlib.util.spec_from_file_location(
              "noerith_oci_qualification",
              root / "tools" / "verify_linux_oci_sandbox.py",
          )
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          with tempfile.TemporaryDirectory(prefix="noerith-pid-diag-") as td:
              harness = module._compile_runtime_harness(root, Path(td))
              record = module._run_harness(
                  harness,
                  os.environ["NOERITH_IMAGE"],
                  module._pid_pressure_script(),
                  timeout=120,
              )
          Path(os.environ["NOERITH_DIAG"]).write_text(
              json.dumps(record, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          fi

          cp "$PULL_LOG" "$BUNDLE/pull.log" 2>/dev/null || true
          cp "$QUAL_LOG" "$BUNDLE/qualification.log" 2>/dev/null || true
          printf '{"pull_status":%s,"qualification_status":%s}\n' "$pull_status" "$qual_status" >"$BUNDLE/relay-status.json"

          if [[ "$pull_status" -ne 0 || "$qual_status" -ne 0 ]]; then
            echo "NOERITH_REAL_QUALIFICATION=FAIL"
            exit 1
          fi
          echo "NOERITH_REAL_QUALIFICATION=PASS"

      - name: Encrypt qualification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="${RUNNER_TEMP}/noerith-s05-bundle"
          TAR="${RUNNER_TEMP}/noerith-s05-evidence.tar"
          CIPHER="${RUNNER_TEMP}/noerith-s05-evidence.cms"
          test -d "$BUNDLE"
          tar -C "$BUNDLE" -cf "$TAR" .
          openssl cms -encrypt -binary -aes256 -outform DER \
            -in "$TAR" \
            -out "$CIPHER" \
            certs/noerith-s05-evidence-recipient.pem
          sha256sum "$CIPHER" | sed 's# .*$##' | sed 's/^/NOERITH_ENCRYPTED_EVIDENCE_SHA256=/'
          rm -rf "$BUNDLE" "$TAR"

      - name: Upload encrypted qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noerith-s05-encrypted-evidence
          path: ${{ runner.temp }}/noerith-s05-evidence.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Enforce real qualification result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.real_qualification.outcome }}" = "success"
          echo "NOERITH_TASK3_REAL_RUNTIME=PASS"
