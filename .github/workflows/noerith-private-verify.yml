name: NOERITH exact private-head verification

on:
  push:
    branches:
      - "build/noerith-private-verify-20260923"

permissions:
  contents: read

concurrency:
  group: noerith-private-verify-20260923
  cancel-in-progress: false

jobs:
  relay-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate relay privacy contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-noerith-relay-contract.sh

  verify:
    needs: relay-self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: ba101bd866378122e20ae4fdd728342b529b45c3
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Exact private NOERITH checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh

      - name: Q06 Task5 focused validator GREEN
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >/dev/null 2>&1
          export RUSTUP_TOOLCHAIN=1.98.1
          LOG="${RUNNER_TEMP}/q06-task5-focused.jsonl"
          set +e
          (
            cd "$ROOT"
            cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml \
              --test validator --locked --message-format=json
          ) >"$LOG" 2>&1
          status=$?
          set -e
          python3 - "$LOG" "$status" <<'PY'
          import hashlib, json, re, sys
          path, status_text = sys.argv[1], sys.argv[2]
          status = int(status_text)
          raw = open(path, encoding="utf-8", errors="replace").read()
          codes = set()
          for line in raw.splitlines():
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if event.get("reason") != "compiler-message":
                  continue
              message = event.get("message") or {}
              if message.get("level") != "error":
                  continue
              code = (message.get("code") or {}).get("code")
              if code:
                  codes.add(code)
          failed = sorted(set(re.findall(r"^test ([^ ]+) \.\.\. FAILED$", raw, re.MULTILINE)))
          print(f"NOERITH_TASK5_FOCUSED_STATUS={status}")
          print(f"NOERITH_TASK5_FOCUSED_FAILED_TEST_COUNT={len(failed)}")
          for code in sorted(codes):
              print(f"NOERITH_TASK5_FOCUSED_RUST_ERROR_CODE={code}")
          for name in failed:
              print("NOERITH_TASK5_FOCUSED_FAILED_TEST_SHA256=" + hashlib.sha256(name.encode()).hexdigest())
          print("NOERITH_TASK5_FOCUSED_GREEN=" + ("PASS" if status == 0 else "FAIL"))
          if status != 0:
              raise SystemExit(1)
          PY
          rm -f "$LOG"
          rm -rf "$ROOT"
