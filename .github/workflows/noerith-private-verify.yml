name: NOERITH exact private-head verification

on:
  push:
    branches:
      - "build/noerith-private-verify-20260923"

permissions:
  contents: read

concurrency:
  group: noerith-private-verify-20260923
  cancel-in-progress: false

jobs:
  relay-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate relay privacy contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-noerith-relay-contract.sh

  verify:
    needs: relay-self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 96951582e8415dfcf8642c8540c18de897ce5798
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Exact private NOERITH checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh

      - name: Q06 Task5 absent-interface RED classification
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >/dev/null 2>&1
          export RUSTUP_TOOLCHAIN=1.98.1
          LOG="${RUNNER_TEMP}/q06-task5-red.jsonl"
          set +e
          (
            cd "$ROOT"
            cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml \
              --test validator --locked --message-format=json
          ) >"$LOG" 2>&1
          status=$?
          set -e
          python3 - "$LOG" "$status" <<'PY'
          import json, sys
          path, status_text = sys.argv[1], sys.argv[2]
          status = int(status_text)
          codes = set()
          with open(path, encoding="utf-8", errors="replace") as handle:
              for line in handle:
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if event.get("reason") != "compiler-message":
                      continue
                  message = event.get("message") or {}
                  if message.get("level") != "error":
                      continue
                  code = (message.get("code") or {}).get("code")
                  if code:
                      codes.add(code)
          print(f"NOERITH_TASK5_RED_CARGO_STATUS={status}")
          for code in sorted(codes):
              print(f"NOERITH_TASK5_RED_RUST_ERROR_CODE={code}")
          expected = status != 0 and bool(codes.intersection({"E0432", "E0433"}))
          print("NOERITH_TASK5_ABSENT_INTERFACE_RED=" + ("PASS" if expected else "FAIL"))
          if not expected:
              raise SystemExit(1)
          PY
          rm -f "$LOG"
          rm -rf "$ROOT"
