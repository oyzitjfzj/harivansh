name: NOERITH Q06 analyzer TDD

on:
  push:
    branches:
      - "build/noerith-private-verify-20260923"

permissions:
  contents: read

concurrency:
  group: noerith-q06-analyzer-tdd
  cancel-in-progress: false

jobs:
  verify-q06-analyzer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: 5ea348a55da2df6bab0952c41c19048e24f68196
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate relay privacy contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-noerith-relay-contract.sh

      - name: Exact private NOERITH checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh

      - name: Q06 analyzer classify
        shell: bash
        run: |
          set +e
          set -uo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update >/dev/null 2>&1
          export RUSTUP_TOOLCHAIN=1.98.1
          LOG="${RUNNER_TEMP}/q06-analyzer.log"
          cd "$ROOT"
          rustc --version | sed 's/^/NOERITH_Q06_RUSTC=/'
          cargo test --manifest-path tools/q06-fixed-corpus-analyzer/Cargo.toml --all-targets --message-format=json >"$LOG" 2>&1
          status=$?
          python3 - "$LOG" <<'PY'
          import hashlib, json, re, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          codes = {}
          for line in raw.splitlines():
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if event.get("reason") != "compiler-message":
                  continue
              message = event.get("message") or {}
              if message.get("level") != "error":
                  continue
              code = (message.get("code") or {}).get("code") or "NO_CODE"
              codes[code] = codes.get(code, 0) + 1
          for code, count in sorted(codes.items()):
              print(f"NOERITH_Q06_ANALYZER_RUST_ERROR_CODE={code} count={count}")
          for line in raw.splitlines():
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if event.get("reason") != "compiler-message":
                  continue
              message = event.get("message") or {}
              if message.get("level") != "error":
                  continue
              code = (message.get("code") or {}).get("code") or "NO_CODE"
              for span in message.get("spans") or []:
                  if not span.get("is_primary"):
                      continue
                  path = str(span.get("file_name") or "")
                  path_hash = hashlib.sha256(path.encode()).hexdigest()
                  print(
                      "NOERITH_Q06_ANALYZER_ERROR_SITE="
                      f"{code}:path_sha256={path_hash}:"
                      f"line={span.get('line_start')}:col={span.get('column_start')}"
                  )
          failed = sorted(set(re.findall(r"^test ([^ ]+) \.\.\. FAILED$", raw, re.MULTILINE)))
          print(f"NOERITH_Q06_ANALYZER_FAILED_TEST_COUNT={len(failed)}")
          for name in failed:
              print("NOERITH_Q06_ANALYZER_FAILED_TEST_SHA256=" + hashlib.sha256(name.encode()).hexdigest())
          PY
          echo "NOERITH_Q06_ANALYZER_STATUS=$status"
          rm -f "$LOG"
          exit 0

      - name: Q06 qualifier TDD classification
        shell: bash
        run: |
          set +e
          set -uo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          export RUSTUP_TOOLCHAIN=1.98.1
          cd "$ROOT"
          cargo build --quiet --manifest-path tools/q06-fixed-corpus-analyzer/Cargo.toml
          build_status=$?
          echo "NOERITH_Q06_QUALIFIER_BUILD_STATUS=$build_status"
          if [ "$build_status" -ne 0 ]; then
            echo "NOERITH_Q06_QUALIFIER_STATUS=BUILD_BLOCKED"
            exit 0
          fi
          export NOERITH_Q06_ANALYZER_BIN="$ROOT/tools/q06-fixed-corpus-analyzer/target/debug/noerith-q06-fixed-corpus-analyzer"
          LOG="${RUNNER_TEMP}/q06-qualifier.log"
          python3 -m unittest tools.tests.test_q06_fixed_corpus_analyzer_qualification -v >"$LOG" 2>&1
          status=$?
          python3 - "$LOG" <<'PY'
          import hashlib, re, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          failed = sorted(set(re.findall(r"^(test_[A-Za-z0-9_]+).*\.\.\. (?:FAIL|ERROR)$", raw, re.MULTILINE)))
          print(f"NOERITH_Q06_QUALIFIER_FAILED_TEST_COUNT={len(failed)}")
          for name in failed:
              print("NOERITH_Q06_QUALIFIER_FAILED_TEST_SHA256=" + hashlib.sha256(name.encode()).hexdigest())
          if "ModuleNotFoundError" in raw or "ImportError" in raw:
              print("NOERITH_Q06_QUALIFIER_IMPORT_ERROR=1")
          summary = re.findall(r"FAILED \(([^)]*)\)", raw)
          for item in summary:
              safe = {}
              for key in ("failures", "errors", "skipped"):
                  match = re.search(rf"{key}=(\d+)", item)
                  if match:
                      safe[key] = int(match.group(1))
              print("NOERITH_Q06_QUALIFIER_SUMMARY=" + ",".join(f"{k}={v}" for k,v in sorted(safe.items())))
          for exc in ("AssertionError","QualifierError","TypeError","ValueError","KeyError","NameError","SyntaxError","FileNotFoundError"):
              count = raw.count(exc)
              if count:
                  print(f"NOERITH_Q06_QUALIFIER_EXCEPTION={exc} count={count}")
          for path, line in re.findall(r'File "([^"]+)", line (\d+)', raw):
              print(
                  "NOERITH_Q06_QUALIFIER_TRACE_SITE="
                  + hashlib.sha256(path.encode()).hexdigest()
                  + ":line=" + line
              )
          PY
          echo "NOERITH_Q06_QUALIFIER_STATUS=$status"
          rm -f "$LOG"
          exit 0

      - name: Q06 real qualification evidence
        shell: bash
        run: |
          set +e
          set -uo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          export RUSTUP_TOOLCHAIN=1.98.1
          cd "$ROOT"
          cargo build --quiet --manifest-path tools/q06-fixed-corpus-analyzer/Cargo.toml
          build_status=$?
          if [ "$build_status" -ne 0 ]; then
            echo "NOERITH_Q06_REAL_QUALIFICATION_STATUS=BUILD_BLOCKED"
            exit 0
          fi
          BIN="$ROOT/tools/q06-fixed-corpus-analyzer/target/debug/noerith-q06-fixed-corpus-analyzer"
          REPORT="${RUNNER_TEMP}/q06-real-qualification.json"
          python3 tools/q06_fixed_corpus_analyzer_qualification.py             --analyzer "$BIN"             --manifest experiments/s05-q06-fixed-corpus-analyzer-qualification.json             --source-revision "$TARGET_SHA"             --output "$REPORT"
          status=$?
          python3 - "$REPORT" <<'PY'
          import json, sys
          try:
              report = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("NOERITH_Q06_REAL_QUALIFICATION_REPORT=UNREADABLE")
              raise SystemExit(0)
          for key in (
              "status",
              "source_revision",
              "analyzer_binary_sha256",
              "qualifier_source_sha256",
              "manifest_sha256",
              "qualification_report_digest",
              "case_count",
              "heldout_case_count",
              "mutation_killed_count",
          ):
              print(f"NOERITH_Q06_REAL_QUALIFICATION_{key.upper()}={report.get(key)}")
          PY
          echo "NOERITH_Q06_REAL_QUALIFICATION_EXIT=$status"
          rm -f "$REPORT"
          exit 0
