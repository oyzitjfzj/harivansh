name: NOERITH Q06 analyzer TDD

on:
  push:
    branches:
      - "build/noerith-private-verify-20260923"

permissions:
  contents: read

concurrency:
  group: noerith-q06-analyzer-tdd
  cancel-in-progress: false

jobs:
  verify-q06-analyzer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: 27840ba5f2ff4d8400838fc8b795371e07274861
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate relay privacy contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-noerith-relay-contract.sh

      - name: Exact private NOERITH checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh

      - name: Real Q06 authoring classify
        shell: bash
        run: |
          set +e
          set -uo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update >/dev/null 2>&1
          export RUSTUP_TOOLCHAIN=1.98.1
          LOG="${RUNNER_TEMP}/q06-real-memory.log"
          cd "$ROOT"
          cargo test --locked --manifest-path tools/q06-memory-context-eval/Cargo.toml --test schema_seed --message-format=json >"$LOG" 2>&1
          status=$?
          python3 - "$LOG" <<'PY'
          import hashlib, json, re, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          codes = {}
          for line in raw.splitlines():
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if event.get("reason") != "compiler-message":
                  continue
              message = event.get("message") or {}
              if message.get("level") != "error":
                  continue
              code = (message.get("code") or {}).get("code") or "NO_CODE"
              codes[code] = codes.get(code, 0) + 1
          for code, count in sorted(codes.items()):
              print(f"NOERITH_Q06_REAL_RUST_ERROR_CODE={code} count={count}")
          failed = sorted(set(re.findall(r"^test ([^ ]+) ... FAILED$", raw, re.MULTILINE)))
          print(f"NOERITH_Q06_REAL_FAILED_TEST_COUNT={len(failed)}")
          for name in failed:
              print("NOERITH_Q06_REAL_FAILED_TEST_SHA256=" + hashlib.sha256(name.encode()).hexdigest())
          PY
          echo "NOERITH_Q06_REAL_STATUS=$status"
          if [ "$status" -eq 0 ] && [ -f tools/q06-memory-context-eval/Cargo.lock ]; then
            echo "NOERITH_Q06_REAL_LOCK_SHA256=$(sha256sum tools/q06-memory-context-eval/Cargo.lock | cut -d' ' -f1)"
            printf 'NOERITH_Q06_REAL_LOCK_BASE64='
            base64 -w0 tools/q06-memory-context-eval/Cargo.lock
            printf '\n'
          fi
          rm -f "$LOG"

          SELFTEST_LOG="${RUNNER_TEMP}/q06-real-memory-selftest.log"
          cargo run --locked --quiet --manifest-path tools/q06-memory-context-eval/Cargo.toml -- --self-test-only >"$SELFTEST_LOG" 2>&1
          selftest_status=$?
          echo "NOERITH_Q06_REAL_SELFTEST_STATUS=$selftest_status"
          rm -f "$SELFTEST_LOG"

          FMT_ROOT="${RUNNER_TEMP}/q06-real-fmt"
          rm -rf "$FMT_ROOT"
          mkdir -p "$FMT_ROOT"
          while IFS= read -r -d '' path; do
            if ! rustfmt --edition 2024 --check "$path" >/dev/null 2>&1; then
              rel="${path#$ROOT/}"
              echo "NOERITH_Q06_REAL_FMT_PATH_SHA256=$(printf '%s' "$rel" | sha256sum | cut -d' ' -f1)"
              formatted="$FMT_ROOT/$(printf '%s' "$rel" | sha256sum | cut -d' ' -f1).rs"
              cp "$path" "$formatted"
              rustfmt --edition 2024 "$formatted" >/dev/null 2>&1 || true
              python3 - "$path" "$formatted" <<'PY'
          import difflib, hashlib, sys
          old = open(sys.argv[1], encoding="utf-8").read().splitlines()
          new = open(sys.argv[2], encoding="utf-8").read().splitlines()
          for tag, i1, i2, j1, j2 in difflib.SequenceMatcher(a=old, b=new).get_opcodes():
              if tag == "equal":
                  continue
              print(
                  "NOERITH_Q06_REAL_FMT_EDIT="
                  f"{tag}:old={i1+1}-{i2}:new={j1+1}-{j2}:"
                  f"old_count={i2-i1}:new_count={j2-j1}"
              )
              for idx in range(i1, i2):
                  raw = old[idx].encode()
                  print(
                      "NOERITH_Q06_REAL_FMT_OLD="
                      f"line={idx+1}:len={len(raw)}:sha256={hashlib.sha256(raw).hexdigest()}"
                  )
              for idx in range(j1, j2):
                  raw = new[idx].encode()
                  print(
                      "NOERITH_Q06_REAL_FMT_NEW="
                      f"line={idx+1}:len={len(raw)}:sha256={hashlib.sha256(raw).hexdigest()}"
                  )
          PY
            fi
          done < <(find "$ROOT/tools/q06-memory-context-eval" -type f -name '*.rs' -print0 | sort -z)
          rm -rf "$FMT_ROOT"

          ISO_LOG="${RUNNER_TEMP}/q06-real-memory-isolated.log"
          python3 tools/verify_isolated_pinned_crate.py tools/q06-memory-context-eval >"$ISO_LOG" 2>&1
          isolated_status=$?
          python3 - "$ISO_LOG" <<'PY'
          import re, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          lower = raw.lower()
          stages = [
              ("PROFILE", "no reviewed isolated dependency profile"),
              ("MANIFEST", "unsupported manifest"),
              ("PROFILE_MISMATCH", "must be exactly"),
              ("METADATA_DEPENDENCY", "unexpected direct dependency resolution"),
              ("FMT", "cargo fmt"),
              ("CHECK", "cargo check"),
              ("CLIPPY", "cargo clippy"),
              ("TEST", "cargo test"),
          ]
          for label, marker in stages:
              if marker in lower:
                  print(f"NOERITH_Q06_REAL_ISOLATED_CLASS={label}")
          for code in sorted(set(re.findall(r"error\\[(E\\d{4})\\]", raw))):
              print(f"NOERITH_Q06_REAL_ISOLATED_RUST_ERROR_CODE={code}")
          failed = re.findall(
              r"verification error: command failed with exit code \\d+: cargo (generate-lockfile|fetch|metadata|fmt|check|clippy|test)\\b",
              raw,
          )
          for command in failed:
              print(f"NOERITH_Q06_REAL_ISOLATED_FAILED_COMMAND={command.upper()}")
          for marker, label in (
              ("unexpected direct dependency resolution", "METADATA_DEPENDENCY"),
              ("no reviewed isolated dependency profile", "PROFILE"),
              ("unsupported manifest", "MANIFEST"),
          ):
              if marker in lower:
                  print(f"NOERITH_Q06_REAL_ISOLATED_FAILURE_CLASS={label}")
          PY
          echo "NOERITH_Q06_REAL_ISOLATED_STATUS=$isolated_status"
          rm -f "$ISO_LOG"
          exit 0

      - name: Q06 pinned verifier profile TDD classification
        shell: bash
        run: |
          set +e
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          cd "$ROOT"
          LOG="${RUNNER_TEMP}/q06-pinned-profile.log"
          python3 -m unittest tools.tests.test_verify_isolated_pinned_crate_profiles -v >"$LOG" 2>&1
          status=$?
          python3 - "$LOG" <<'PY'
          import hashlib, re, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          failed = sorted(set(re.findall(r"^(test_[A-Za-z0-9_]+).*... (?:FAIL|ERROR)$", raw, re.MULTILINE)))
          print(f"NOERITH_Q06_PINNED_PROFILE_FAILED_TEST_COUNT={len(failed)}")
          for name in failed:
              print("NOERITH_Q06_PINNED_PROFILE_FAILED_TEST_SHA256=" + hashlib.sha256(name.encode()).hexdigest())
          PY
          echo "NOERITH_Q06_PINNED_PROFILE_STATUS=$status"
          rm -f "$LOG"
          exit 0

      - name: Q06 analyzer classify
        shell: bash
        run: |
          set +e
          set -uo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update >/dev/null 2>&1
          export RUSTUP_TOOLCHAIN=1.98.1
          LOG="${RUNNER_TEMP}/q06-analyzer.log"
          cd "$ROOT"
          rustc --version | sed 's/^/NOERITH_Q06_RUSTC=/'
          cargo test --manifest-path tools/q06-fixed-corpus-analyzer/Cargo.toml --all-targets --message-format=json >"$LOG" 2>&1
          status=$?
          python3 - "$LOG" <<'PY'
          import hashlib, json, re, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          codes = {}
          for line in raw.splitlines():
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if event.get("reason") != "compiler-message":
                  continue
              message = event.get("message") or {}
              if message.get("level") != "error":
                  continue
              code = (message.get("code") or {}).get("code") or "NO_CODE"
              codes[code] = codes.get(code, 0) + 1
          for code, count in sorted(codes.items()):
              print(f"NOERITH_Q06_ANALYZER_RUST_ERROR_CODE={code} count={count}")
          for line in raw.splitlines():
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if event.get("reason") != "compiler-message":
                  continue
              message = event.get("message") or {}
              if message.get("level") != "error":
                  continue
              code = (message.get("code") or {}).get("code") or "NO_CODE"
              for span in message.get("spans") or []:
                  if not span.get("is_primary"):
                      continue
                  path = str(span.get("file_name") or "")
                  path_hash = hashlib.sha256(path.encode()).hexdigest()
                  print(
                      "NOERITH_Q06_ANALYZER_ERROR_SITE="
                      f"{code}:path_sha256={path_hash}:"
                      f"line={span.get('line_start')}:col={span.get('column_start')}"
                  )
          failed = sorted(set(re.findall(r"^test ([^ ]+) \.\.\. FAILED$", raw, re.MULTILINE)))
          print(f"NOERITH_Q06_ANALYZER_FAILED_TEST_COUNT={len(failed)}")
          for name in failed:
              print("NOERITH_Q06_ANALYZER_FAILED_TEST_SHA256=" + hashlib.sha256(name.encode()).hexdigest())
          PY
          echo "NOERITH_Q06_ANALYZER_STATUS=$status"
          rm -f "$LOG"
          exit 0

      - name: Q06 qualifier TDD classification
        shell: bash
        run: |
          set +e
          set -uo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          export RUSTUP_TOOLCHAIN=1.98.1
          cd "$ROOT"
          cargo build --quiet --manifest-path tools/q06-fixed-corpus-analyzer/Cargo.toml
          build_status=$?
          echo "NOERITH_Q06_QUALIFIER_BUILD_STATUS=$build_status"
          if [ "$build_status" -ne 0 ]; then
            echo "NOERITH_Q06_QUALIFIER_STATUS=BUILD_BLOCKED"
            exit 0
          fi
          export NOERITH_Q06_ANALYZER_BIN="$ROOT/tools/q06-fixed-corpus-analyzer/target/debug/noerith-q06-fixed-corpus-analyzer"
          LOG="${RUNNER_TEMP}/q06-qualifier.log"
          python3 -m unittest tools.tests.test_q06_fixed_corpus_analyzer_qualification -v >"$LOG" 2>&1
          status=$?
          python3 - "$LOG" <<'PY'
          import hashlib, re, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          failed = sorted(set(re.findall(r"^(test_[A-Za-z0-9_]+).*\.\.\. (?:FAIL|ERROR)$", raw, re.MULTILINE)))
          print(f"NOERITH_Q06_QUALIFIER_FAILED_TEST_COUNT={len(failed)}")
          for name in failed:
              print("NOERITH_Q06_QUALIFIER_FAILED_TEST_SHA256=" + hashlib.sha256(name.encode()).hexdigest())
          if "ModuleNotFoundError" in raw or "ImportError" in raw:
              print("NOERITH_Q06_QUALIFIER_IMPORT_ERROR=1")
          summary = re.findall(r"FAILED \(([^)]*)\)", raw)
          for item in summary:
              safe = {}
              for key in ("failures", "errors", "skipped"):
                  match = re.search(rf"{key}=(\d+)", item)
                  if match:
                      safe[key] = int(match.group(1))
              print("NOERITH_Q06_QUALIFIER_SUMMARY=" + ",".join(f"{k}={v}" for k,v in sorted(safe.items())))
          for exc in ("AssertionError","QualifierError","TypeError","ValueError","KeyError","NameError","SyntaxError","FileNotFoundError"):
              count = raw.count(exc)
              if count:
                  print(f"NOERITH_Q06_QUALIFIER_EXCEPTION={exc} count={count}")
          for path, line in re.findall(r'File "([^"]+)", line (\d+)', raw):
              print(
                  "NOERITH_Q06_QUALIFIER_TRACE_SITE="
                  + hashlib.sha256(path.encode()).hexdigest()
                  + ":line=" + line
              )
          PY
          echo "NOERITH_Q06_QUALIFIER_STATUS=$status"
          rm -f "$LOG"
          exit 0

      - name: Q06 real qualification evidence
        shell: bash
        run: |
          set +e
          set -uo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          export RUSTUP_TOOLCHAIN=1.98.1
          cd "$ROOT"
          cargo build --quiet --manifest-path tools/q06-fixed-corpus-analyzer/Cargo.toml
          build_status=$?
          if [ "$build_status" -ne 0 ]; then
            echo "NOERITH_Q06_REAL_QUALIFICATION_STATUS=BUILD_BLOCKED"
            exit 0
          fi
          BIN="$ROOT/tools/q06-fixed-corpus-analyzer/target/debug/noerith-q06-fixed-corpus-analyzer"
          REPORT="${RUNNER_TEMP}/q06-real-qualification.json"
          python3 tools/q06_fixed_corpus_analyzer_qualification.py             --analyzer "$BIN"             --manifest experiments/s05-q06-fixed-corpus-analyzer-qualification.json             --source-revision "$TARGET_SHA"             --output "$REPORT"
          status=$?
          python3 - "$REPORT" <<'PY'
          import json, sys
          try:
              report = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("NOERITH_Q06_REAL_QUALIFICATION_REPORT=UNREADABLE")
              raise SystemExit(0)
          for key in (
              "status",
              "source_revision",
              "analyzer_binary_sha256",
              "qualifier_source_sha256",
              "manifest_sha256",
              "qualification_report_digest",
              "case_count",
              "heldout_case_count",
              "mutation_killed_count",
          ):
              print(f"NOERITH_Q06_REAL_QUALIFICATION_{key.upper()}={report.get(key)}")
          PY
          echo "NOERITH_Q06_REAL_QUALIFICATION_EXIT=$status"
          rm -f "$REPORT"
          exit 0
