          sed -i 's/^          //' "$TMP/recipient.pem"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -recip "$TMP/recipient.pem" \
            -in "$TMP/fixed.tar.gz" \
            -out "$TMP/fixed.cms"
          cp "$TMP/fixed.cms" "${RUNNER_TEMP}/q06-task5-clippy-fixed.cms"
          sha256sum "${RUNNER_TEMP}/q06-task5-clippy-fixed.cms" | awk '{print "NOERITH_Q06_TASK5_CLIPPY_FIX_CIPHER_SHA256="$1}'
          rm -rf "$TMP"

      - name: Upload encrypted clippy-fix handoff
        uses: actions/upload-artifact@v4
        with:
          name: q06-task5-clippy-fixed-cms-20261003
          path: ${{ runner.temp }}/q06-task5-clippy-fixed.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
