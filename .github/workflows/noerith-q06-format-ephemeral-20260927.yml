name: NOERITH Q06 ephemeral private rustfmt handoff 20260927

on:
  push:
    branches:
      - "build/noerith-private-verify-20260923"

permissions:
  contents: read

concurrency:
  group: noerith-q06-format-ephemeral-20260927
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: a605b1ddd6d9ff28411cdb24a9f48cd8e78c7475
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Exact private NOERITH checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh

      - name: Format private Q06 crate and encrypt to ephemeral recipient
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update >/dev/null 2>&1
          export RUSTUP_TOOLCHAIN=1.98.1
          TMP="$(mktemp -d)"
          cp -R "$ROOT/tools/q06-memory-context-eval" "$TMP/formatted"
          cargo fmt --manifest-path "$TMP/formatted/Cargo.toml"
          tar -C "$TMP/formatted" -czf "$TMP/formatted.tar.gz" src tests
          cat > "$TMP/recipient.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
