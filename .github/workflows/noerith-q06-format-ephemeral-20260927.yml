name: NOERITH Q06 ephemeral private clippy-fix handoff 20261003

on:
  push:
    branches:
      - "build/noerith-private-verify-20260923"
    paths:
      - ".github/workflows/noerith-q06-format-ephemeral-20260927.yml"

permissions:
  contents: read

concurrency:
  group: noerith-q06-clippy-fix-ephemeral-20261003
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_SHA: c525f5f7a0bdf0984cecf543ce6ba41f6a494abd
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Exact private NOERITH checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh

      - name: Apply machine suggestions privately and encrypt handoff
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --no-self-update >/dev/null 2>&1
          export RUSTUP_TOOLCHAIN=1.98.1
          TMP="$(mktemp -d)"
          cp -R "$ROOT/tools/q06-memory-context-eval" "$TMP/fixed"
          cargo clippy --fix --allow-dirty --allow-staged --manifest-path "$TMP/fixed/Cargo.toml" --all-targets --locked -- -D warnings >/dev/null 2>&1
          cargo fmt --manifest-path "$TMP/fixed/Cargo.toml"
          cargo clippy --manifest-path "$TMP/fixed/Cargo.toml" --all-targets --locked -- -D warnings >/dev/null 2>&1
          tar -C "$TMP/fixed" -czf "$TMP/fixed.tar.gz" src tests
          cat > "$TMP/recipient.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIELTCCApWgAwIBAgIUb9Y49esfO3NxPFTzWc+O2ezir9YwDQYJKoZIhvcNAQEL
