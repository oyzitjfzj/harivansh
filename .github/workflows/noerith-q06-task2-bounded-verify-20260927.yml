name: NOERITH Q06 Task 3 typed oracle qualification

on:
  push:
    branches:
      - "build/noerith-private-verify-20260923"
    paths:
      - ".github/workflows/noerith-q06-task2-bounded-verify-20260927.yml"

permissions:
  contents: read

concurrency:
  group: noerith-q06-task2-bounded-verify-20260927
  cancel-in-progress: false

jobs:
  relay-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate relay privacy contract
        shell: bash
        run: bash tests/test-noerith-relay-contract.sh

  verify:
    needs: relay-self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_SHA: b393479edcbe8e04c8984acdc553c831fb93c97c
      Q06_MANIFEST: tools/q06-memory-context-eval/Cargo.toml
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Exact private NOERITH checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --no-self-update >/dev/null
          rustc +1.98.1 --version
          cargo +1.98.1 --version

      - name: Format check
        shell: bash
        run: |
          set +e
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-task2-fmt.log"
          cargo +1.98.1 fmt --manifest-path "$ROOT/$Q06_MANIFEST" -- --check >"$LOG" 2>&1
          status=$?
          if [[ "$status" -eq 0 ]]; then
            echo "NOERITH_Q06_TASK3_FMT=PASS"
          else
            echo "NOERITH_Q06_TASK3_FMT=FAIL"
          fi
          rm -f "$LOG"
          exit "$status"

      - name: Known-state kernel tests
        shell: bash
        run: |
          set +e
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-task2-known.log"
          cargo +1.98.1 test --manifest-path "$ROOT/$Q06_MANIFEST" --test kernel --locked -- --nocapture >"$LOG" 2>&1
          status=$?
          python3 - "$LOG" <<'PY'
          import hashlib, re, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          failed = sorted(set(re.findall(r"^test ([^ ]+) \.\.\. FAILED$", raw, re.MULTILINE)))
          print(f"NOERITH_Q06_TASK3_KNOWN_FAILED_COUNT={len(failed)}")
          for name in failed:
              print("NOERITH_Q06_TASK3_KNOWN_FAILED_SHA256=" + hashlib.sha256(name.encode()).hexdigest())
          PY
          echo "NOERITH_Q06_TASK3_KNOWN_STATUS=$status"
          rm -f "$LOG"
          exit "$status"

      - name: Bounded exploration and mutant-sensitivity tests
        shell: bash
        run: |
          set +e
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-task2-bounded.log"
          cargo +1.98.1 test --manifest-path "$ROOT/$Q06_MANIFEST" --test kernel_bounded --locked -- --nocapture >"$LOG" 2>&1
          status=$?
          python3 - "$LOG" <<'PY'
          import hashlib, re, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          failed = sorted(set(re.findall(r"^test ([^ ]+) \.\.\. FAILED$", raw, re.MULTILINE)))
          print(f"NOERITH_Q06_TASK3_BOUNDED_FAILED_COUNT={len(failed)}")
          for name in failed:
              print("NOERITH_Q06_TASK3_BOUNDED_FAILED_SHA256=" + hashlib.sha256(name.encode()).hexdigest())
          for marker in ("Q06_BOUNDED_CORRECTION", "Q06_BOUNDED_LIFECYCLE", "Q06_BOUNDED_TAINT", "Q06 mixed bound:"):
              match = re.search(rf"{marker}[^\n]*", raw)
              if match:
                  safe = re.sub(r"[^A-Za-z0-9_= -]", "", match.group(0))
                  print(safe)
          PY
          python3 - "$LOG" <<'PYHISTORY'
          import re, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          match = re.search(r"^Q06_HISTORY differential_prefixes=\d+ accepted_traces=\d+ max_actions=\d+$", raw, re.MULTILINE)
          if match:
              print(match.group(0))
          PYHISTORY
          echo "NOERITH_Q06_TASK3_BOUNDED_STATUS=$status"
          rm -f "$LOG"
          exit "$status"

      - name: Typed probe oracle tests
        shell: bash
        run: |
          set +e
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-task3-oracle.log"
          cargo +1.98.1 test --manifest-path "$ROOT/$Q06_MANIFEST" --test oracle --locked >"$LOG" 2>&1
          status=$?
          python3 - "$LOG" <<'PYORACLE'
          import re, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          passed = sum(int(n) for n in re.findall(r"test result: ok\. (\d+) passed;", raw))
          print(f"NOERITH_Q06_TASK3_ORACLE_PASSED_COUNT={passed}")
          PYORACLE
          echo "NOERITH_Q06_TASK3_ORACLE_STATUS=$status"
          rm -f "$LOG"
          exit "$status"

      - name: Full standalone Q06 crate
        shell: bash
        run: |
          set +e
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-task2-full.log"
          cargo +1.98.1 test --manifest-path "$ROOT/$Q06_MANIFEST" --locked >"$LOG" 2>&1
          status=$?
          python3 - "$LOG" <<'PY'
          import re, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          failed = sorted(set(re.findall(r"^test ([^ ]+) \.\.\. FAILED$", raw, re.MULTILINE)))
          print(f"NOERITH_Q06_TASK3_FULL_FAILED_COUNT={len(failed)}")
          passed = sum(map(int, re.findall(r"test result: ok\. (\d+) passed;", raw)))
          print(f"NOERITH_Q06_TASK3_FULL_PASSED_COUNT={passed}")
          PY
          echo "NOERITH_Q06_TASK3_FULL_STATUS=$status"
          rm -f "$LOG"
          exit "$status"

      - name: Strict clippy
        shell: bash
        run: |
          set +e
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-task2-clippy.jsonl"
          cargo +1.98.1 clippy --manifest-path "$ROOT/$Q06_MANIFEST" --all-targets --locked --message-format=json -- -D warnings >"$LOG" 2>&1
          status=$?
          python3 - "$LOG" <<'PY'
          import json, sys
          codes = {}
          with open(sys.argv[1], encoding="utf-8", errors="replace") as handle:
              for line in handle:
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if event.get("reason") != "compiler-message":
                      continue
                  message = event.get("message") or {}
                  if message.get("level") not in ("error", "warning"):
                      continue
                  code = (message.get("code") or {}).get("code") or "NO_CODE"
                  codes[code] = codes.get(code, 0) + 1
          for code, count in sorted(codes.items()):
              print(f"NOERITH_Q06_TASK3_CLIPPY_CODE={code} count={count}")
          PY
          echo "NOERITH_Q06_TASK3_CLIPPY_STATUS=$status"
          rm -f "$LOG"
          exit "$status"

      - name: Real compiled transition mutants
        shell: bash
        run: |
          set +e
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-task2-mutants.log"
          RUSTUP_TOOLCHAIN=1.98.1 python3 -I "$ROOT/tools/verify_q06_kernel_mutants.py" --offline >"$LOG" 2>&1
          status=$?
          if [[ "$status" -eq 0 ]] && grep -Fxq 'Q06_MUTANTS compiled_kills=22/22' "$LOG"; then
            echo "NOERITH_Q06_TASK3_REAL_MUTANTS=PASS compiled_kills=22/22"
          else
            echo "NOERITH_Q06_TASK3_REAL_MUTANTS=FAIL"
            status=1
          fi
          rm -f "$LOG"
          exit "$status"

      - name: Isolated pinned-crate verification
        shell: bash
        run: |
          set +e
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-task2-isolated.log"
          CLEAN="$(mktemp -d)"
          (
            cd "$CLEAN"
            RUSTUP_TOOLCHAIN=1.98.1 python3 -I "$ROOT/tools/verify_isolated_pinned_crate_hermetic.py" tools/q06-memory-context-eval
          ) >"$LOG" 2>&1
          status=$?
          python3 - "$LOG" <<'PY'
          import re, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          for stage in ("selftest", "rustc", "generate-lockfile", "fetch", "metadata", "fmt", "check", "clippy", "test"):
              if stage == "selftest":
                  pattern = "isolated verifier contract self-tests passed"
              elif stage == "rustc":
                  pattern = "+ rustc --version"
              else:
                  pattern = f"+ cargo {stage} "
              print(f"NOERITH_Q06_TASK3_ISOLATED_REACHED_{stage.replace('-', '_')}={1 if pattern in raw else 0}")
          for code in sorted(set(re.findall(r"error\[(E\d{4})\]", raw))):
              print(f"NOERITH_Q06_TASK3_ISOLATED_RUST_ERROR_CODE={code}")
          PY
          echo "NOERITH_Q06_TASK3_ISOLATED_STATUS=$status"
          rm -f "$LOG"
          rm -rf "$CLEAN"
          exit "$status"

      - name: Private checkout stayed clean
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          if git -C "$ROOT" diff --quiet && git -C "$ROOT" diff --cached --quiet; then
            echo "NOERITH_Q06_TASK3_WORKTREE_CLEAN=PASS"
          else
            echo "NOERITH_Q06_TASK3_WORKTREE_CLEAN=FAIL"
            exit 1
          fi

      - name: Final bounded verification marker
        shell: bash
        run: echo "NOERITH_Q06_TASK3_BOUNDED_VERIFY=PASS sha=$TARGET_SHA"

