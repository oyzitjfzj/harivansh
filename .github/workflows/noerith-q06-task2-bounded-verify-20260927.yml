name: NOERITH Q06 Task 5 clippy locator

on:
  push:
    branches:
      - "build/noerith-private-verify-20260923"
    paths:
      - ".github/workflows/noerith-q06-task2-bounded-verify-20260927.yml"

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_SHA: c525f5f7a0bdf0984cecf543ce6ba41f6a494abd
      Q06_MANIFEST: tools/q06-memory-context-eval/Cargo.toml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact private NOERITH checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Locate strict-clippy diagnostics without source disclosure
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          rustup toolchain install 1.98.1 --profile minimal --component clippy --no-self-update >/dev/null
          LOG="${RUNNER_TEMP}/clippy.jsonl"
          set +e
          cargo +1.98.1 clippy --manifest-path "$ROOT/$Q06_MANIFEST" --all-targets --locked --message-format=json -- -D warnings >"$LOG" 2>&1
          status=$?
          set -e
          python3 - "$LOG" "$ROOT" <<'PY'
          import json, os, sys
          log, root = sys.argv[1], sys.argv[2]
          seen=set()
          for line in open(log,encoding='utf-8',errors='replace'):
              try: event=json.loads(line)
              except json.JSONDecodeError: continue
              if event.get('reason')!='compiler-message': continue
              msg=event.get('message') or {}
              if msg.get('level') not in ('error','warning'): continue
              code=(msg.get('code') or {}).get('code') or 'NO_CODE'
              spans=msg.get('spans') or []
              primary=next((s for s in spans if s.get('is_primary')),spans[0] if spans else {})
              path=primary.get('file_name','UNKNOWN')
              if path.startswith(root+'/'): path=path[len(root)+1:]
              row=(code,path,primary.get('line_start',0),primary.get('line_end',0))
              if row not in seen:
                  seen.add(row)
                  print('NOERITH_Q06_TASK5_CLIPPY_LOC='+'|'.join(map(str,row)))
          print(f'NOERITH_Q06_TASK5_CLIPPY_LOC_COUNT={len(seen)}')
          print(f'NOERITH_Q06_TASK5_CLIPPY_EXIT={status_placeholder}')
          PY
          rm -f "$LOG"
          exit "$status"
