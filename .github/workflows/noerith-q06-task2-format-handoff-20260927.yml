name: NOERITH Q06 Task 2 ephemeral format handoff 20260927

on:
  push:
    branches:
      - "build/noerith-private-verify-20260923"
    paths:
      - ".github/workflows/noerith-q06-task2-format-handoff-20260927.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: 1de43efa0d964eb6502dccb5e5186e2fc547ce78
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate relay privacy contract
        shell: bash
        run: bash tests/test-noerith-relay-contract.sh

      - name: Exact private NOERITH checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh

      - name: Format private Q06 crate and encrypt handoff
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update >/dev/null 2>&1
          export RUSTUP_TOOLCHAIN=1.98.1
          TMP="$(mktemp -d)"
          cp -R "$ROOT/tools/q06-memory-context-eval" "$TMP/formatted"
          cargo fmt --manifest-path "$TMP/formatted/Cargo.toml" >/dev/null
          tar -C "$TMP/formatted" -czf "$TMP/formatted.tar.gz" src tests
          cat > "$TMP/recipient.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEQzCCAqugAwIBAgIULl3baMozHhj8Riyycwgm6mKsuKIwDQYJKoZIhvcNAQEL
