          -----END CERTIFICATE-----
          CERT
          openssl x509 -in "$TMP/recipient.pem" -noout >/dev/null
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -recip "$TMP/recipient.pem" \
            -in "$TMP/formatted.tar.gz" \
            -out "${RUNNER_TEMP}/q06-task2-formatted.cms"
          sha256sum "${RUNNER_TEMP}/q06-task2-formatted.cms" | awk '{print "NOERITH_Q06_TASK2_FORMAT_CIPHER_SHA256="$1}'
          rm -rf "$TMP"

      - name: Upload encrypted handoff
        uses: actions/upload-artifact@v4
        with:
          name: q06-task2-formatted-cms-20260927
          path: ${{ runner.temp }}/q06-task2-formatted.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
