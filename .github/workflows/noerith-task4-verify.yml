name: NOERITH evidence-grader exact private-head verification

on:
  push:
    branches:
      - "build/noerith-grader-qualification-verify-20260923"

permissions:
  contents: read

concurrency:
  group: noerith-grader-qualification-verify-20260923
  cancel-in-progress: false

jobs:
  relay-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate relay privacy contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-noerith-relay-contract.sh

  verify:
    needs: relay-self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 9ec6aed2ecdbd371fcc61ca4b207cc43fd64b7c4
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Exact private NOERITH checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh

      - name: Evidence-grader qualification candidate verification
        id: candidate
        continue-on-error: true
        shell: bash
        env:
          NOERITH_ENCRYPTED_DIAGNOSTIC_DIR: ${{ runner.temp }}/noerith-grader-qualification-diagnostic
        run: bash scripts/run-noerith-verification.sh

      - name: Encrypt failed qualification diagnostics
        if: steps.candidate.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          DIAG="${RUNNER_TEMP}/noerith-grader-qualification-diagnostic"
          TAR="${RUNNER_TEMP}/noerith-grader-qualification-diagnostic.tar"
          CIPHER="${RUNNER_TEMP}/noerith-grader-qualification-diagnostic.cms"
          test -d "$DIAG"
          tar -C "$DIAG" -cf "$TAR" .
          openssl cms -encrypt -binary -aes256 -outform DER \
            -in "$TAR" \
            -out "$CIPHER" \
            certs/noerith-task4-evidence-recipient.pem
          sha256sum "$CIPHER" | sed 's# .*$##' | sed 's/^/NOERITH_GRADER_DIAGNOSTIC_SHA256=/'
          rm -rf "$DIAG" "$TAR"

      - name: Upload encrypted failed qualification diagnostics
        if: steps.candidate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: noerith-grader-qualification-encrypted-diagnostic
          path: ${{ runner.temp }}/noerith-grader-qualification-diagnostic.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Enforce evidence-grader qualification candidate result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.candidate.outcome }}" = "success"
          echo "NOERITH_GRADER_QUALIFICATION_CANDIDATE=PASS"
