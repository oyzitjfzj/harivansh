name: NOERITH action outcome-truth state-space GREEN verification

on:
  push:
    branches:
      - "build/noerith-action-outcome-truth-verify-20260923"

permissions:
  contents: read

concurrency:
  group: noerith-action-outcome-truth-verify-20260923
  cancel-in-progress: false

jobs:
  relay-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate relay privacy contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-noerith-relay-contract.sh

  verify-green:
    needs: relay-self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_SHA: bc0ba8fa959893d669264a20bfe31423e20d687e
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact private NOERITH checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Focused state-space verification
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/action-outcome-state-space-green.log"
          cd "$ROOT"
          if ! python3 -m py_compile               tools/grade_action_outcome_truth.py               tools/verify_action_outcome_truth_state_space.py               tools/tests/test_verify_action_outcome_truth_state_space.py               >"$LOG" 2>&1; then
            rm -f "$LOG"
            echo "NOERITH_ACTION_OUTCOME_STATE_SPACE_GREEN=FAIL phase=compile" >&2
            exit 1
          fi
          if ! python3 -m unittest tools.tests.test_verify_action_outcome_truth_state_space -v               >"$LOG" 2>&1; then
            rm -f "$LOG"
            echo "NOERITH_ACTION_OUTCOME_STATE_SPACE_GREEN=FAIL phase=tests" >&2
            exit 1
          fi
          if ! python3 tools/verify_action_outcome_truth_state_space.py --self-test-only               >"$LOG" 2>&1; then
            rm -f "$LOG"
            echo "NOERITH_ACTION_OUTCOME_STATE_SPACE_GREEN=FAIL phase=self-test" >&2
            exit 1
          fi
          rm -f "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo "NOERITH_ACTION_OUTCOME_STATE_SPACE_GREEN=PASS sha=$TARGET_SHA"
