name: NOERITH action outcome-truth calibration runner RED verification

on:
  push:
    branches:
      - "build/noerith-action-outcome-truth-verify-20260923"

permissions:
  contents: read

concurrency:
  group: noerith-action-outcome-truth-verify-20260923
  cancel-in-progress: false

jobs:
  relay-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate relay privacy contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-noerith-relay-contract.sh

  verify-red:
    needs: relay-self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: 2e2570279fde90da67bc5ed8212829218bcdf7e6
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact private NOERITH checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Observe intended calibration-runner missing-module RED
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/action-outcome-calibration-runner-red.log"
          cd "$ROOT"
          set +e
          python3 -m unittest tools.tests.test_run_action_outcome_truth_protocol_calibration >"$LOG" 2>&1
          code=$?
          set -e
          if [[ "$code" -ne 0 ]]              && [[ ! -e tools/run_action_outcome_truth_protocol_calibration.py ]]              && grep -Fq "No module named 'tools.run_action_outcome_truth_protocol_calibration'" "$LOG"; then
            rm -f "$LOG"
            echo "NOERITH_ACTION_OUTCOME_CALIBRATION_RUNNER_RED=PASS reason=missing-implementation-module"
            exit 0
          fi
          rm -f "$LOG"
          echo "NOERITH_ACTION_OUTCOME_CALIBRATION_RUNNER_RED=UNEXPECTED" >&2
          exit 1
