name: NOERITH action outcome-truth state-space RED verification

on:
  push:
    branches:
      - "build/noerith-action-outcome-truth-verify-20260923"

permissions:
  contents: read

concurrency:
  group: noerith-action-outcome-truth-verify-20260923
  cancel-in-progress: false

jobs:
  relay-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate relay privacy contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-noerith-relay-contract.sh

  verify-red:
    needs: relay-self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: 1c94e179dcb528333ecf5efd96e265cd4b043fda
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact private NOERITH checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Observe intended state-space missing-module RED
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/action-outcome-state-space-red.log"
          cd "$ROOT"
          set +e
          python3 -m unittest tools.tests.test_verify_action_outcome_truth_state_space >"$LOG" 2>&1
          code=$?
          set -e
          if [[ "$code" -ne 0 ]] \
             && [[ ! -e tools/verify_action_outcome_truth_state_space.py ]] \
             && grep -Fq "No module named 'tools.verify_action_outcome_truth_state_space'" "$LOG"; then
            rm -f "$LOG"
            echo "NOERITH_ACTION_OUTCOME_STATE_SPACE_RED=PASS reason=missing-implementation-module"
            exit 0
          fi
          rm -f "$LOG"
          echo "NOERITH_ACTION_OUTCOME_STATE_SPACE_RED=UNEXPECTED" >&2
          exit 1
