name: NOERITH action outcome-truth calibration evidence

on:
  push:
    branches:
      - "build/noerith-action-outcome-truth-verify-20260923"

permissions:
  contents: read

concurrency:
  group: noerith-action-outcome-truth-verify-20260923
  cancel-in-progress: false

jobs:
  relay-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate relay privacy contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-noerith-relay-contract.sh

  calibrate:
    needs: relay-self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_SHA: 30b965c97575dde5581bf115420910c18395e2a2
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Exact private NOERITH checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh

      - name: Reproduce calibration twice
        id: calibration
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -uo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          A="${RUNNER_TEMP}/action-calibration-a"
          B="${RUNNER_TEMP}/action-calibration-b"
          LOG="${RUNNER_TEMP}/action-calibration-evidence.log"
          cd "$ROOT"
          {
            python3 tools/run_action_outcome_truth_protocol_calibration.py --output-dir "$A"
            python3 tools/run_action_outcome_truth_protocol_calibration.py --output-dir "$B"
            for name in cases observations policy report; do
              cmp -s "$A/action-outcome-truth-${name}.json" "$B/action-outcome-truth-${name}.json"
            done
          } >"$LOG" 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" -ne 0 ]]; then
            echo "NOERITH_ACTION_OUTCOME_CALIBRATION_EVIDENCE=FAIL" >&2
            exit 1
          fi
          rm -f "$LOG"
          echo "NOERITH_ACTION_OUTCOME_CALIBRATION_REPRODUCIBLE=PASS"
          for name in cases observations policy report; do
            digest="$(sha256sum "$A/action-outcome-truth-${name}.json" | awk '{print $1}')"
            echo "NOERITH_ACTION_OUTCOME_CALIBRATION_ARTIFACT_${name^^}=sha256:$digest"
          done
          echo "NOERITH_ACTION_OUTCOME_GRADER_SHA256=sha256:$(sha256sum tools/grade_action_outcome_truth.py | awk '{print $1}')"
          echo "NOERITH_ACTION_OUTCOME_STATE_SPACE_SHA256=sha256:$(sha256sum tools/verify_action_outcome_truth_state_space.py | awk '{print $1}')"
          echo "NOERITH_ACTION_OUTCOME_CALIBRATION_OWNER_SHA256=sha256:$(sha256sum tools/verify_grader_calibration.py | awk '{print $1}')"
          echo "NOERITH_ACTION_OUTCOME_CALIBRATION_RUNNER_SHA256=sha256:$(sha256sum tools/run_action_outcome_truth_protocol_calibration.py | awk '{print $1}')"
          echo "NOERITH_ACTION_OUTCOME_CALIBRATION_TEST_SHA256=sha256:$(sha256sum tools/tests/test_run_action_outcome_truth_protocol_calibration.py | awk '{print $1}')"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1],encoding="utf-8")); print("NOERITH_ACTION_OUTCOME_CALIBRATION_REPORT_DIGEST="+r["report_digest"]); print("NOERITH_ACTION_OUTCOME_CALIBRATION_POLICY_DIGEST="+r["policy_digest"]); print("NOERITH_ACTION_OUTCOME_CALIBRATION_OBSERVATION_DIGEST="+r["observation_digest"]); print("NOERITH_ACTION_OUTCOME_CALIBRATION_RESULT="+r["overall_status"].upper()); print("NOERITH_ACTION_OUTCOME_CALIBRATION_TOTAL="+str(r["counts"]["total"])); print("NOERITH_ACTION_OUTCOME_CALIBRATION_EXACT_AGREEMENT="+str(r["metrics"]["exact_agreement"]["numerator"])+"/"+str(r["metrics"]["exact_agreement"]["denominator"])); print("NOERITH_ACTION_OUTCOME_CALIBRATION_FALSE_PASS="+str(r["metrics"]["false_pass_rate"]["numerator"])+"/"+str(r["metrics"]["false_pass_rate"]["denominator"])); print("NOERITH_ACTION_OUTCOME_CALIBRATION_CRITICAL="+",".join(x["status"] for x in r["critical_checks"]))' "$A/action-outcome-truth-report.json"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Encrypt failed calibration diagnostic
        if: always() && steps.calibration.outputs.code != '0'
        shell: bash
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/action-calibration-evidence.log"
          CIPHER="${RUNNER_TEMP}/action-calibration-evidence.cms"
          test -s "$LOG"
          openssl cms -encrypt -binary -aes256 -outform DER             -in "$LOG"             -out "$CIPHER"             certs/noerith-state-space-debug-recipient.pem
          rm -f "$LOG"
          echo "NOERITH_ACTION_OUTCOME_CALIBRATION_DIAGNOSTIC_ENCRYPTED=PASS"

      - name: Upload encrypted failed calibration diagnostic
        if: always() && steps.calibration.outputs.code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: noerith-action-calibration-evidence-encrypted-diagnostic
          path: ${{ runner.temp }}/action-calibration-evidence.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Enforce calibration evidence result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.calibration.outputs.code }}" = "0"
          echo "NOERITH_ACTION_OUTCOME_CALIBRATION_EVIDENCE=PASS sha=$TARGET_SHA"
