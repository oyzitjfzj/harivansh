name: NOERITH Task4 exact private-head verification

on:
  push:
    branches:
      - "build/noerith-task4-verify-20260923"

permissions:
  contents: read

concurrency:
  group: noerith-task4-verify-20260923
  cancel-in-progress: false

jobs:
  relay-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate relay privacy contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-noerith-relay-contract.sh

  verify:
    needs: relay-self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: d162af032455e3882629b50ce6561845dd985c2c
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Exact private NOERITH checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh

      - name: Task4 candidate verification
        id: candidate
        continue-on-error: true
        shell: bash
        env:
          NOERITH_ENCRYPTED_DIAGNOSTIC_DIR: ${{ runner.temp }}/noerith-task4-diagnostic
        run: bash scripts/run-noerith-verification.sh

      - name: Encrypt failed Task4 diagnostics
        if: steps.candidate.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          DIAG="${RUNNER_TEMP}/noerith-task4-diagnostic"
          TAR="${RUNNER_TEMP}/noerith-task4-diagnostic.tar"
          CIPHER="${RUNNER_TEMP}/noerith-task4-diagnostic.cms"
          test -d "$DIAG"
          tar -C "$DIAG" -cf "$TAR" .
          openssl cms -encrypt -binary -aes256 -outform DER \
            -in "$TAR" \
            -out "$CIPHER" \
            certs/noerith-task4-evidence-recipient.pem
          sha256sum "$CIPHER" | sed 's# .*$##' | sed 's/^/NOERITH_TASK4_DIAGNOSTIC_SHA256=/'
          rm -rf "$DIAG" "$TAR"

      - name: Upload encrypted failed Task4 diagnostics
        if: steps.candidate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: noerith-task4-encrypted-diagnostic
          path: ${{ runner.temp }}/noerith-task4-diagnostic.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Enforce Task4 candidate result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.candidate.outcome }}" = "success"
          echo "NOERITH_TASK4_BINDING=PASS"
