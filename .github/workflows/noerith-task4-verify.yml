name: NOERITH action outcome-truth RED verification

on:
  push:
    branches:
      - "build/noerith-action-outcome-truth-verify-20260923"

permissions:
  contents: read

concurrency:
  group: noerith-action-outcome-truth-verify-20260923
  cancel-in-progress: false

jobs:
  relay-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate relay privacy contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-noerith-relay-contract.sh

  verify-red:
    needs: relay-self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: 1397d0b8c30848290c0b83b4815551cbb11f660e
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact private NOERITH checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Observe intended missing-module RED
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/action-outcome-red.log"
          cd "$ROOT"
          set +e
          python3 -m unittest tools.tests.test_grade_action_outcome_truth >"$LOG" 2>&1
          code=$?
          set -e
          if [[ "$code" -ne 0 ]] \
             && [[ ! -e tools/grade_action_outcome_truth.py ]] \
             && grep -Fq "No module named 'tools.grade_action_outcome_truth'" "$LOG"; then
            rm -f "$LOG"
            echo "NOERITH_ACTION_OUTCOME_TDD_RED=EXPECTED_MISSING_MODULE"
            exit 0
          fi
          rm -f "$LOG"
          echo "NOERITH_ACTION_OUTCOME_TDD_RED=UNEXPECTED" >&2
          exit 1
