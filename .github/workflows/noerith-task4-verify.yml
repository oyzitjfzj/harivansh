name: NOERITH action outcome-truth state-space full verification

on:
  push:
    branches:
      - "build/noerith-action-outcome-truth-verify-20260923"

permissions:
  contents: read

concurrency:
  group: noerith-action-outcome-truth-verify-20260923
  cancel-in-progress: false

jobs:
  relay-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate relay privacy contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-noerith-relay-contract.sh

  verify-full:
    needs: relay-self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: bc0ba8fa959893d669264a20bfe31423e20d687e
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Exact private NOERITH checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh

      - name: Action outcome affected Python verification
        id: python_gates
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -uo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/action-outcome-full-python.log"
          cd "$ROOT"
          {
            python3 -m py_compile               tools/grade_action_outcome_truth.py               tools/verify_action_outcome_truth_state_space.py               tools/tests/test_grade_action_outcome_truth.py               tools/tests/test_verify_action_outcome_truth_state_space.py
            python3 -m unittest discover -s tools/tests -p 'test_*.py'
            python3 tools/grade_action_outcome_truth.py --self-test-only
            python3 tools/verify_action_outcome_truth_state_space.py --self-test-only
          } >"$LOG" 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" -eq 0 ]]; then
            rm -f "$LOG"
            echo "NOERITH_ACTION_OUTCOME_PYTHON=PASS"
            exit 0
          fi
          echo "NOERITH_ACTION_OUTCOME_PYTHON=FAIL" >&2
          exit 1

      - name: Existing S05 hermetic verification
        id: hermetic
        if: always() && steps.python_gates.outputs.code == '0'
        continue-on-error: true
        shell: bash
        env:
          NOERITH_ENCRYPTED_DIAGNOSTIC_DIR: ${{ runner.temp }}/noerith-action-full-diagnostic
        run: |
          set +e
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          bash scripts/run-noerith-verification.sh
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Encrypt failed diagnostics
        if: always() && (steps.python_gates.outputs.code != '0' || steps.hermetic.outputs.code != '0')
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="${RUNNER_TEMP}/noerith-action-full-diagnostic"
          mkdir -p "$BUNDLE"
          if [[ -f "${RUNNER_TEMP}/action-outcome-full-python.log" ]]; then
            mv "${RUNNER_TEMP}/action-outcome-full-python.log" "$BUNDLE/python.log"
          fi
          TAR="${RUNNER_TEMP}/noerith-action-full-diagnostic.tar"
          CIPHER="${RUNNER_TEMP}/noerith-action-full-diagnostic.cms"
          tar -C "$BUNDLE" -cf "$TAR" .
          openssl cms -encrypt -binary -aes256 -outform DER             -in "$TAR"             -out "$CIPHER"             certs/noerith-state-space-debug-recipient.pem
          rm -rf "$BUNDLE" "$TAR"
          echo "NOERITH_ACTION_OUTCOME_FULL_DIAGNOSTIC_ENCRYPTED=PASS"

      - name: Upload encrypted failed diagnostics
        if: always() && (steps.python_gates.outputs.code != '0' || steps.hermetic.outputs.code != '0')
        uses: actions/upload-artifact@v4
        with:
          name: noerith-action-state-space-full-encrypted-diagnostic
          path: ${{ runner.temp }}/noerith-action-full-diagnostic.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Enforce full verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.python_gates.outputs.code }}" = "0"
          test "${{ steps.hermetic.outputs.code }}" = "0"
          echo "NOERITH_ACTION_OUTCOME_STATE_SPACE_FULL=PASS sha=$TARGET_SHA"
