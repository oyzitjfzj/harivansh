name: S04 isolated final qualification
on:
  push:
    branches: [verify-s04-final]
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.98.1
      - name: Qualify isolated S04 cognition
        run: python3 tools/verify_isolated_std_crate.py crates/noerith-cognition
