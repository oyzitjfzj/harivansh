name: S05 Task5 Task6 focused verification
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
      - name: Focused S05 evidence and Q07 identity seams
        run: |
          candidate="$RUNNER_TEMP/noerith-capabilities"
          cp -R crates/noerith-capabilities "$candidate"
          cargo test --manifest-path "$candidate/Cargo.toml" --test quality_trial_evidence_binding -- --nocapture
          cargo test --manifest-path "$candidate/Cargo.toml" --test quality_trial_configuration -- --nocapture
          cargo test --manifest-path "$candidate/Cargo.toml" --test quality_comparison -- --nocapture
