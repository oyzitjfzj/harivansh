name: S05 Sandbox Qualification Probe

on:
  push:
    branches:
      - "build/s05-sandbox-probe-*"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout probe harness
        uses: actions/checkout@v4

      - name: Runner and Docker facts
        run: |
          set -euo pipefail
          uname -a
          echo "ImageOS=${ImageOS:-unknown}"
          echo "ImageVersion=${ImageVersion:-unknown}"
          docker version
          docker info --format 'Server={{.ServerVersion}} Driver={{.Driver}} Cgroup={{.CgroupVersion}} Security={{json .SecurityOptions}}'

      - name: Resolve exact Rust image
        run: |
          set -euo pipefail
          docker pull rust:1.98.1-slim-bookworm
          image_digest="$(docker image inspect rust:1.98.1-slim-bookworm --format '{{index .RepoDigests 0}}')"
          test -n "$image_digest"
          echo "S05_PROBE_IMAGE=$image_digest" >> "$GITHUB_ENV"
          echo "Resolved image: $image_digest"

      - name: Qualify bounded Linux evaluation sandbox
        run: bash probe/s05_linux_eval_sandbox.sh
