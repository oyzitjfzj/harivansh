[workspace]
resolver = "3"
members = [
    "crates/noerith-broker",
    "crates/noerith-cognition",
    "crates/noerith-contracts",
    "crates/noerith-effects",
    "crates/noerith-kernel",
    "crates/noerith-policy",
    "crates/noerith-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
zeroize = "=1.9.0"
